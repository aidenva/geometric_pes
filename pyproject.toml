[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "geometric_pes"
version = "1.0.0"
description = "Geometric product decisions on bifurcating potential energy surfaces and the finite internal drains that keep them"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["geometric_pes*"]
